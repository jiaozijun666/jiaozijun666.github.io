cv:
  name: Zijun Jiao
  label: Research Assistant, The Future Laboratory, Tsinghua University
  email: zijunjiaoapply@163.com
  location: Beijing, China
  image: ""
  summary: >
    Data-driven optimization and decision-making for sustainable operations, with interests in
    demand and condition forecasting, robust and resource-aware predictive modelling, and the
    integration of predictive models with optimization for maintenance, capacity and service
    decisions. Applying for PhD programmes starting Fall 2027.

  social_networks:
    - network: GitHub
      username: jiaozijun666

  # Section names below are the ones the CV renderer knows how to lay out
  # (Experience, Education, Projects, Skills, Languages). Renaming one to
  # something else silently renders an empty card.
  sections:
    Experience:
      - company: Tsinghua University — advised by Prof. Haipeng Mi
        position: Backend and tool-agent orchestration for an air-gapped railway intelligence system
        location: Beijing, China
        start_date: 2025-06
        highlights:
          - "Backend and integration: responsible for backend construction, covering data processing and the integration of external tool agents, within a network-isolated on-premise language-model system supporting office and maintenance workflows at a heavy-haul railway operator."
          - "Meeting-documentation workflow: designed and built the automated meeting-minutes workflow as a two-tier agent — a controller that selects among registered retrieval, transcription and reasoning tools, and a sub-agent that converts noisy transcripts into structured minutes through noise reduction, semantic reconstruction and topic structuring."
          - "Reliability and data governance: introduced a permissioned four-zone workspace (read-only knowledge base, write-isolated user input, scratch space, results directory) together with an explicit delegation contract between the two tiers, so that agent actions cannot modify authoritative enterprise records."

      - company: National University of Singapore — course research project
        position: Resource-aware benchmarking of classical and deep time-series forecasters
        start_date: 2025-01
        end_date: 2025-05
        highlights:
          - "Study design: compared six forecasters (Prophet, LightGBM, DLinear, LSTM, Transformer, DARNN) across five time-series datasets spanning energy consumption, air quality, manufacturing productivity, urban traffic and biomedical gait, with dataset-specific preprocessing and leakage-controlled train/test pipelines."
          - "Evaluation framework: assessed forecasting performance using MAE, RMSE, MAPE and sMAPE, together with directional and threshold accuracy, training time, peak memory usage and robustness to additive Gaussian noise."
          - "My contribution: implemented and evaluated the Prophet and Transformer components of the benchmark, including preprocessing, model configuration and training, and contributed to the comparative analysis of accuracy, computational efficiency and robustness under deployment constraints."
          
      - company: National University of Singapore
        position: LLM-assisted ESG metric extraction and standardisation for healthcare reporting
        start_date: 2024-08
        end_date: 2024-11
        highlights:
          - "Backend data-processing pipeline: implemented PDF parsing, text cleaning and segmentation, and ESG metric extraction to transform heterogeneous sustainability reports into structured indicator–value–unit records with confidence information."
          - "NLP/LLM integration: integrated semantic matching and language-model components to standardise free-form ESG metrics against a canonical taxonomy and prepare structured outputs for downstream scoring, database storage and dashboard visualisation."
          
      - company: University of Southampton — undergraduate dissertation, sole author, advised by Dr. Itamar Yaakov
        position: Machine-learning representations for quantum many-body ground states
        start_date: 2023-10
        end_date: 2024-05
        highlights:
          - "Reviewed and compared neural-network quantum states, matrix-product and projected entangled-pair tensor networks, and restricted Boltzmann machines as compressed variational representations of exponentially large wavefunctions, covering variational optimisation, imaginary-time evolution, and variational Monte Carlo with stochastic reconfiguration."
          - "Analysed the expressivity relationship between restricted Boltzmann machine and matrix-product-state representations and the conditions for conversion between them, using entanglement entropy as the comparison criterion."

